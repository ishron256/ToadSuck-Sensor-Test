[env:esp32-s3-wroom-n4]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = partitions_singleapp_large.csv
board_build.arduino.memory_type = qio_qspi
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Raw bit-banged BME280 ID read (bypasses the SPI driver); build with: pio run -e bme280-bitbang -t upload
[env:bme280-bitbang]
extends = env:esp32-s3-wroom-n4
build_flags = -DBME280_BITBANG_TEST
